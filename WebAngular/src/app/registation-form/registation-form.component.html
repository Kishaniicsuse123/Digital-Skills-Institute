<div class="registration-wrapper">
    <div class="d-flex justify-content-between mb-4">

    <div [class.active]="currentStep === 1">
      <b>1. Personal</b>
    </div>

    <div [class.active]="currentStep === 2">
      <b>2. Contact</b>
    </div>

    <div [class.active]="currentStep === 3">
      <b>3. Education</b>
    </div>

    <div [class.active]="currentStep === 4">
      <b>4. Submit</b>
    </div>

  </div>
  <!-- <form #regForm="ngForm"> -->
<form #regForm="ngForm" (ngSubmit)="SaveRecord()">

  <!-- STEP 1 -->
      <div *ngIf="currentStep === 1">
          <h4>Personal Details</h4>
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="fullName" [(ngModel)]="registration.fullName" required>
          </div>

          <div class="form-group">
            <label>Father/Mother Name</label>
            <input type="text" name="fatherMotherName" [(ngModel)]="registration.fatherMotherName">
          </div>

          <div class="form-group">
            <label>Gender</label>
            <select name="gender" [(ngModel)]="registration.gender">
            
              <option value="">Select Gender</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            
            </select>
          </div>
        
          <div class="form-group">
            <label>Date Of Birth</label>
            <input type="date" name="dateOfBirth" [(ngModel)]="registration.dateOfBirth">
          </div>

        <div class="form-group">
          <label>Profile Photo</label>
          <input type="file" name="profilePhoto" (change)="onFileSelected($event)">
        </div>
        <button class="btn btn-primary" (click)="nextStep()"> Next </button>
      </div>
      
      <div *ngIf="currentStep === 2">
            <h3>Contact Details</h3>
         <div class="ContactDetailsmain">
            <div class="ContactDetails">
              <div class="form-group">
                <label>Mobile Number *</label>
                <input type="text" name="mobileNumber" [(ngModel)]="registration.mobileNumber" required>
              </div>
            
              <div class="form-group">
                <label>Alternate Mobile Number</label>
                <input type="text" name="alternateMobileNumber" [(ngModel)]="registration.alternateMobileNumber">
              </div>
            
              <div class="form-group">
                <label>Email *</label>
                <input type="email" name="emailAddress" [(ngModel)]="registration.emailAddress" required>
              </div>
            
              <div class="form-group full-width">
                <label>Address</label>
                <textarea rows="3" name="addressLine" [(ngModel)]="registration.addressLine">
              </textarea>
              </div>
          </div>
          <div class="ContactDetails">
              <div class="form-group">
                <label>City</label>
                <input type="text" name="city" [(ngModel)]="registration.city">
              </div>
            
              <div class="form-group">
                <label>State</label>
                <input type="text" name="state" [(ngModel)]="registration.state">
              </div>
            
              <div class="form-group">
                <label>Pincode</label>
                <input type="text" name="pincode" [(ngModel)]="registration.pincode">
              </div>
          </div>
          </div>
          <button class="btn btn-secondary me-2" (click)="previousStep()">Previous</button>

          <button class="btn btn-primary" (click)="nextStep()"> Next </button>
      </div>
          
       <div *ngIf="currentStep === 3">
            <div class="form-group">
              <label>Course Name *</label>
              <input type="text" name="courseName" [(ngModel)]="registration.courseName" required>
            </div>

            <div class="form-group">
              <label>Course Mode</label>
              <select name="courseMode" [(ngModel)]="registration.courseMode">
              
                <option value="">Select Mode</option>
                <option>Online</option>
                <option>Offline</option>
                <option>Hybrid</option>
              
              </select>
            </div>

            <div class="form-group">
              <label>Course Duration</label>
              <input type="text" name="courseDuration" [(ngModel)]="registration.courseDuration">
            </div>
          
            <div class="form-group">
              <label>Batch Timing</label>
              <input type="text" name="batchTiming" [(ngModel)]="registration.batchTiming">
            </div>
          
            <div class="form-group">
              <label>Preferred Start Date</label>
              <input type="date" name="preferredStartDate" [(ngModel)]="registration.preferredStartDate">
            </div>

            <button class="btn btn-secondary me-2" (click)="previousStep()">Previous</button>

            <button class="btn btn-primary" (click)="nextStep()"> Next </button>

      </div>

      <div *ngIf="currentStep === 4">
            <div class="form-group">
                <label>Highest Qualification</label>
                <input type="text" name="highestQualification" [(ngModel)]="registration.highestQualification">
              </div>
              <div class="form-group">
                <label>College / University</label>
                <input type="text" name="collegeUniversityName" [(ngModel)]="registration.collegeUniversityName">
              </div>
            
              <div class="form-group">
                <label>Passing Year</label>
                <input type="number" name="passingYear" [(ngModel)]="registration.passingYear">
              </div>
            
              <div class="form-group">
                <label>Percentage / CGPA</label>
                <input type="number" step="0.01" name="percentageCGPA" [(ngModel)]="registration.percentageCGPA">
              </div>
            
                <button class="btn btn-secondary me-2" (click)="previousStep()">Previous</button>
            
       <button type="submit" class="btn">Submit</button>  
            
      </div>
  </form>
</div>
